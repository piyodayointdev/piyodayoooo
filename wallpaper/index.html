<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Awallpaper - Pro Edition</title>
  
  <script src="wallpaper_list.js"></script>
  <script src="music_list.js"></script>
  <script src="config.js"></script>

  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; }
    body { 
      font-family: "CustomFont", sans-serif; user-select: none; 
      --accent-hue: 190;
      --accent-alpha: 1;
      --accent-color: hsla(var(--accent-hue), 100%, 50%, var(--accent-alpha));
      --accent-glow: hsla(var(--accent-hue), 100%, 50%, calc(var(--accent-alpha) * 0.6));
      --accent-bright: hsla(var(--accent-hue), 100%, 70%, var(--accent-alpha));
    }
    #bgContainer { position: fixed; top: 50%; left: 50%; width: 110%; height: 110%; transform: translate3d(-50%, -50%, 0); z-index: 0; will-change: transform; }
    #bgVideo { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 0.5s ease; }
    #trigger { position: fixed; top: 0; right: 0; width: 80px; height: 80px; z-index: 1000; cursor: pointer; }

    #uiPanel, #musicPanel {
      box-shadow: 0 0 20px var(--accent-glow), 0 0 10px rgba(0,0,0,0.8);
      border: 1px solid var(--accent-bright) !important;
      overflow: visible !important;
    }

    #uiPanel {
      position: fixed; background: rgba(0, 0, 0, 0.7);
      border-radius: 12px; padding: 25px 25px 0px 25px; z-index: 1001; 
      width: 710px;
      backdrop-filter: blur(20px); color: white;
      display: flex; gap: 20px;
      visibility: hidden; pointer-events: none; opacity: 0; transform: scale(0.9);
      transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      align-items: flex-start;
    }
    #uiPanel.active { visibility: visible; pointer-events: auto; opacity: 1; transform: scale(1); }

    .list-section div, .settings-label, #previewName, .vol-label {
      text-shadow: 0 0 8px var(--accent-glow);
    }

    .drag-handle { position: absolute; top: 0; left: 0; width: 100%; height: 45px; cursor: move; z-index: 10; }
    
    .video-list { 
      display: flex; flex-direction: column; gap: 8px; 
      overflow-y: hidden; overflow-x: hidden; 
      -ms-overflow-style: none; scrollbar-width: none; 
    }
    .video-list::-webkit-scrollbar { display: none; }

    .video-btn { 
      width: 100%; min-height: 40px; padding: 0 15px; background: rgba(255, 255, 255, 0.04); 
      border: 1px solid rgba(255, 255, 255, 0.1); color: white; border-radius: 5px; cursor: pointer; 
      font-size: 12px; text-align: left; transition: all 0.3s ease; box-sizing: border-box;
    }
    .video-btn:hover { background: var(--accent-glow); border-color: var(--accent-color); transform: translateX(8px); box-shadow: 0 0 15px var(--accent-glow); }
    
    .video-btn.active-toggle { 
      background: var(--accent-color); 
      border-color: var(--accent-color); 
      color: #000;
      font-weight: bold;
      box-shadow: none;
      text-shadow: none;
    }

    #musicPanel {
      position: fixed; background: rgba(10, 10, 10, 0.5);
      border-radius: 12px; width: 340px; z-index: 1002; backdrop-filter: blur(20px);
      color: white; visibility: hidden; pointer-events: none; opacity: 0; transform: scale(0.9);
      transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #musicPanel.active { visibility: visible; pointer-events: auto; opacity: 1; transform: scale(1); }

    .music-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; cursor: move; background: rgba(255,255,255,0.02); border-radius: 12px 12px 0 0; }
    #curMusicTitle { 
      color: var(--accent-color); font-size: 13px; letter-spacing: 1px; white-space: nowrap; 
      overflow: hidden; text-overflow: ellipsis; max-width: 160px;
      text-shadow: 0 0 10px var(--accent-glow);
    }
    
    .vol-wrap { display: flex; align-items: center; gap: 8px; position: relative; z-index: 20; }
    .vol-label { font-size: 9px; opacity: 0.6; }

    .music-mid { padding: 10px 15px; display: flex; gap: 15px; align-items: center; background: rgba(0,0,0,0.02); justify-content: center; }
    .img-btn { width: 26px; height: 26px; cursor: pointer; opacity: 0.6; filter: invert(1); transition: 0.2s; }
    .img-btn:hover { opacity: 1; transform: scale(1.1); filter: invert(1) drop-shadow(0 0 5px var(--accent-color)); }
    .img-btn.active { opacity: 1; filter: invert(0.5) sepia(1) saturate(5) hue-rotate(calc(var(--accent-hue) - 200deg)) drop-shadow(0 0 8px var(--accent-color)); }

    .music-bottom { padding: 12px 15px 15px; position: relative; z-index: 20; }
    .time-font { font-size: 16px; color: white; letter-spacing: 1px; margin-bottom: 6px; text-shadow: none; }
    
    .gauge-container { background: rgba(255, 255, 255, 0.1); border-radius: 2px; position: relative; cursor: pointer; }
    .gauge-fill { height: 100%; width: 0%; background: var(--accent-color); pointer-events: none; box-shadow: 0 0 12px var(--accent-glow), 0 0 20px var(--accent-glow); }

    .clock-wrap { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 2; pointer-events: none; text-align: center; }
    #weekday { font-size: 30px; margin-bottom: 8px; color: white; font-weight: bold; }
    #clock { font-size: 60px; font-weight: 600; color: white; display: flex; justify-content: center; }
    .char-slot { position: relative; display: inline-grid; place-items: center; min-width: 0.5em; }
    .char-group { display: grid; place-items: center; }
    .char-group > span { grid-area: 1/1; white-space: pre; line-height: 1; }
    .main-char { position: relative; z-index: 10; }

    .list-section { width: 200px; display: flex; flex-direction: column; flex-shrink: 0; }
    .preview-section { width: 230px; display: flex; flex-direction: column; border-left: 1px solid rgba(255,255,255,0.1); padding: 0 20px; flex-shrink: 0; }
    .effect-section { width: 180px; display: flex; flex-direction: column; border-left: 1px solid rgba(255,255,255,0.1); padding-left: 20px; flex-shrink: 0; }

    .preview-box { width: 100%; aspect-ratio: 16/9; background: #000; border: 1px solid var(--accent-color); border-radius: 4px; overflow: hidden; position: relative; box-shadow: 0 0 10px var(--accent-glow); }
    #previewVideo { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.4s ease; }
    #previewName { color: var(--accent-color); font-size: 16px; margin-top: 10px; min-height: 1.2em; opacity: 0; transition: opacity 0.4s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

    .color-picker-container { margin-top: 20px; }
    .settings-label { font-size: 10px; opacity: 0.4; letter-spacing: 1px; margin-bottom: 8px; }
    .slider-bar-wrap { position: relative; width: 100%; height: 24px; margin-top: 5px; cursor: pointer; }
    .gradient-bg { width: 100%; height: 8px; border-radius: 10px; position: absolute; top: 8px; }
    .color-map { background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%); }
    .alpha-map { background: linear-gradient(to right, transparent, white); background-color: #333; }
    .thumb { position: absolute; top: 0; width: 4px; height: 14px; background: white; border-radius: 2px; box-shadow: 0 0 5px rgba(0,0,0,0.7); pointer-events: none; transform: translateX(-50%); }
    
    .bottom-controls { margin-top: 30px; display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>

  <div id="bgContainer"><video id="bgVideo" autoplay muted loop playsinline></video></div>
  <canvas id="effectCanvas" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none;"></canvas>
  
  <audio id="bgMusic"></audio>
  <div class="clock-wrap"><div id="weekday"></div><div id="clock"></div></div>
  <div id="trigger" onclick="toggleUI()"></div>

  <div id="uiPanel">
    <div class="drag-handle" id="uiDrag"></div>
    
    <div class="list-section">
      <div style="font-size: 10px; opacity: 0.4; margin-bottom: 8px; letter-spacing: 1px;">WALLPAPER</div>
      <div style="display:flex; gap:5px; margin-bottom:8px;">
        <button class="video-btn" style="flex:1; text-align:center; min-height:30px;" onclick="scrollList('vGrid', -100)">▲ UP</button>
        <button class="video-btn" style="flex:1; text-align:center; min-height:30px;" onclick="scrollList('vGrid', 100)">▼ DOWN</button>
      </div>
      <div style="display:flex; gap:5px; margin-bottom:8px;">
        <input type="text" id="customVideoUrl" placeholder="Video URL..." class="video-btn" style="flex:3; font-size:10px; cursor:text; height:30px;">
        <button class="video-btn" style="flex:1; text-align:center; min-height:30px;" onclick="setCustomWallpaper()">SET</button>
      </div>
      <div class="video-list" id="vGrid" style="height: 150px;"></div>
      
      <div style="font-size: 10px; opacity: 0.4; margin-top: 15px; margin-bottom: 8px; letter-spacing: 1px;">MUSIC</div>
      <div style="display:flex; gap:5px; margin-bottom:8px;">
        <button class="video-btn" style="flex:1; text-align:center; min-height:30px;" onclick="scrollList('mGrid', -100)">▲ UP</button>
        <button class="video-btn" style="flex:1; text-align:center; min-height:30px;" onclick="scrollList('mGrid', 100)">▼ DOWN</button>
      </div>
      <div class="video-list" id="mGrid" style="height: 150px;"></div>
    </div>

    <div class="preview-section">
      <div style="font-size: 10px; opacity: 0.4; margin-bottom: 12px; letter-spacing: 1px;">PREVIEW</div>
      <div class="preview-box"><video id="previewVideo" autoplay muted loop playsinline></video></div>
      <div id="previewName">---</div>
      
      <div class="color-picker-container">
        <div class="settings-label">ACCENT COLOR</div>
        <div class="slider-bar-wrap" id="hueBar">
          <div class="gradient-bg color-map"></div>
          <div class="thumb" id="hueThumb"></div>
        </div>
        <div class="settings-label" style="margin-top:10px;">OPACITY</div>
        <div class="slider-bar-wrap" id="alphaBar">
          <div class="gradient-bg alpha-map"></div>
          <div class="thumb" id="alphaThumb"></div>
        </div>
      </div>

      <div class="bottom-controls">
        <div style="display:flex; gap:8px;">
          <button class="video-btn" style="flex:1.5; text-align:center;" onclick="toggleSticky()">PLAYER: <span id="stickyStat">OFF</span></button>
          <button class="video-btn" style="flex:1; text-align:center;" onclick="resetUI()">RESET</button>
        </div>
        <button class="video-btn" onclick="toggleUI()" style="text-align:center; color:#888;">CLOSE</button>
      </div>
    </div>

    <div class="effect-section">
      <div style="font-size: 10px; opacity: 0.4; margin-bottom: 8px; letter-spacing: 1px;">VISUAL EFFECTS</div>
      <div style="display:flex; gap:5px; margin-bottom:8px;">
        <button class="video-btn" style="flex:1; text-align:center; min-height:30px;" onclick="scrollList('eGrid', -100)">▲ UP</button>
        <button class="video-btn" style="flex:1; text-align:center; min-height:30px;" onclick="scrollList('eGrid', 100)">▼ DOWN</button>
      </div>
      <div class="video-list" id="eGrid" style="height: 400px;"></div>
    </div>
  </div>

  <div id="musicPanel">
    <div class="music-top" id="musicDrag">
      <div id="curMusicTitle">NO TRACK</div>
      <div class="vol-wrap">
        <span class="vol-label">VOL</span>
        <div class="gauge-container" id="volGauge" style="width: 80px; height: 3px;">
          <div class="gauge-fill" id="volFill"></div>
        </div>
      </div>
    </div>
    <div class="music-mid">
      <img src="buttons/loop.png" id="btn-loop" class="img-btn" onclick="toggleLoop()">
      <img src="buttons/prev.png" class="img-btn" onclick="prevTrack()">
      <img src="buttons/start.png" id="btn-play" class="img-btn" onclick="togglePlay()">
      <img src="buttons/next.png" class="img-btn" onclick="nextTrack()">
      <img src="buttons/random.png" id="btn-random" class="img-btn" onclick="toggleRandom()">
    </div>
    <div class="music-bottom">
      <div class="time-font" id="currentTime">00:00:00</div>
      <div class="gauge-container" id="seekGauge" style="width: 100%; height: 4px;">
        <div class="gauge-fill" id="seekFill"></div>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('load', function() {
      const vData = window.wallpaperData || {};
      const mData = window.musicData || {};
      const eData = { trail: "MOUSE TRAIL", conn: "CONNECTION LINE", dots: "BACKGROUND DOTS" };

      const bgVideo = document.getElementById('bgVideo');
      const bgMusic = document.getElementById('bgMusic');
      const preVid = document.getElementById('previewVideo');
      const preName = document.getElementById('previewName');
      
      const state = {
        ui: { el: document.getElementById('uiPanel'), tx: 0, ty: 0, cx: 0, cy: 0, drag: false, off: {x:0, y:0} },
        music: { el: document.getElementById('musicPanel'), tx: 0, ty: 0, cx: 0, cy: 0, drag: false, off: {x:0, y:0} },
        scroll: { vGrid: { el: document.getElementById('vGrid'), cur: 0, tgt: 0 }, mGrid: { el: document.getElementById('mGrid'), cur: 0, tgt: 0 }, eGrid: { el: document.getElementById('eGrid'), cur: 0, tgt: 0 } },
        mouse: { x: 0, y: 0, cx: 0, cy: 0, realX: 0, realY: 0 },
        isSeeking: false, isChangingVol: false,
        isChangingHue: false, isChangingAlpha: false,
        hue: parseFloat(localStorage.getItem('accentHue')) || 190,
        alpha: parseFloat(localStorage.getItem('accentAlpha')) || 1,
        effects: {
          trail: localStorage.getItem('effectTrail') !== 'false',
          conn: localStorage.getItem('effectConn') !== 'false',
          dots: localStorage.getItem('effectDots') !== 'false'
        }
      };

      function updateStyles() {
        document.documentElement.style.setProperty('--accent-hue', state.hue);
        document.documentElement.style.setProperty('--accent-alpha', state.alpha);
        document.getElementById('hueThumb').style.left = (state.hue / 360 * 100) + '%';
        document.getElementById('alphaThumb').style.left = (state.alpha * 100) + '%';
        localStorage.setItem('accentHue', state.hue);
        localStorage.setItem('accentAlpha', state.alpha);

        Object.keys(eData).forEach(id => {
          const btn = document.getElementById('btn-eff-' + id);
          if (btn) {
            if (state.effects[id]) btn.classList.add('active-toggle');
            else btn.classList.remove('active-toggle');
          }
        });
      }

      window.toggleEffect = (type) => {
        state.effects[type] = !state.effects[type];
        localStorage.setItem('effect' + type.charAt(0).toUpperCase() + type.slice(1), state.effects[type]);
        updateStyles();
      };

      function forcePlay() { if (bgVideo.paused) { bgVideo.play().catch(()=>{}); } }
      bgVideo.addEventListener('pause', forcePlay);
      setInterval(forcePlay, 1000);

      let isSticky = localStorage.getItem('musicSticky') === 'true';
      let isLoop = localStorage.getItem('musicLoop') === 'true';
      let isRandom = localStorage.getItem('musicRandom') === 'true';

      function enforceBounds(key) {
        const s = state[key];
        const rect = s.el.getBoundingClientRect();
        const margin = 10;
        const maxW = window.innerWidth - rect.width - margin;
        const maxH = window.innerHeight - rect.height - margin;
        if (s.tx < margin) s.tx = margin; if (s.ty < margin) s.ty = margin;
        if (s.tx > maxW) s.tx = maxW; if (s.ty > maxH) s.ty = maxH;
        if (!s.drag) { s.cx = s.tx; s.cy = s.ty; }
      }

      function update() {
        ['ui', 'music'].forEach(key => {
          const s = state[key];
          if(!s.drag) { s.cx += (s.tx - s.cx) * 0.15; s.cy += (s.ty - s.cy) * 0.15; }
          s.el.style.left = s.cx + 'px'; s.el.style.top = s.cy + 'px';
        });
        ['vGrid', 'mGrid', 'eGrid'].forEach(k => { state.scroll[k].cur += (state.scroll[k].tgt - state.scroll[k].cur) * 0.12; state.scroll[k].el.scrollTop = state.scroll[k].cur; });
        let dx = state.mouse.x - state.mouse.cx, dy = state.mouse.y - state.mouse.cy, d = Math.sqrt(dx*dx+dy*dy);
        const config = window.wallpaperConfig || { maxSpeed: 4.0, slowDistance: 270 };
        const spd = d > config.slowDistance ? config.maxSpeed : (d/config.slowDistance)*config.maxSpeed;
        if(d>0.1) { state.mouse.cx += (dx/d)*spd; state.mouse.cy += (dy/d)*spd; }
        document.getElementById('bgContainer').style.transform = `translate3d(calc(-50% + ${state.mouse.cx}px), calc(-50% + ${state.mouse.cy}px), 0)`;
        requestAnimationFrame(update);
      }

      function handleSeek(e) {
        const rect = document.getElementById('seekGauge').getBoundingClientRect();
        const pct = Math.max(0, Math.min((e.clientX - rect.left) / rect.width, 1));
        if (bgMusic.duration) bgMusic.currentTime = pct * bgMusic.duration;
      }
      function handleVol(e) {
        const rect = document.getElementById('volGauge').getBoundingClientRect();
        const vol = Math.max(0, Math.min((e.clientX - rect.left) / rect.width, 1));
        bgMusic.volume = vol;
        document.getElementById('volFill').style.width = (vol * 100) + '%';
        localStorage.setItem('musicVol', vol);
      }

      function init() {
        const config = window.wallpaperConfig || { fontFile: 'font.ttc' };
        const sStyle = document.createElement('style');
        sStyle.textContent = `@font-face { font-family: \"CustomFont\"; src: url(\"${config.fontFile}\"); }`;
        document.head.appendChild(sStyle);

        ['ui', 'music'].forEach(key => {
          let p = JSON.parse(localStorage.getItem(key + 'Pos'));
          state[key].tx = state[key].cx = p ? p.x : (window.innerWidth - (key==='ui'?710:340))/2;
          state[key].ty = state[key].cy = p ? p.y : (window.innerHeight - 400)/2;
          enforceBounds(key);
        });

        Object.keys(vData).forEach(id => {
          const b = document.createElement('button'); b.className = 'video-btn'; b.innerHTML = vData[id];
          b.onmouseenter = () => { 
            preVid.style.opacity = 0; preName.style.opacity = 0;
            setTimeout(() => { preVid.src = `background/${id}.mp4`; preName.textContent = vData[id]; preVid.onloadeddata = () => { preVid.style.opacity = 1; preName.style.opacity = 1; preVid.play(); }; }, 200);
          };
          b.onclick = () => { bgVideo.style.opacity = 0; setTimeout(() => { bgVideo.src = `background/${id}.mp4`; bgVideo.onloadeddata = () => { bgVideo.style.opacity = 1; bgVideo.play(); }; localStorage.setItem('lastWallpaperId', id); }, 300); };
          document.getElementById('vGrid').appendChild(b);
        });

        Object.keys(mData).forEach(id => {
          const b = document.createElement('button'); b.className = 'video-btn'; b.innerHTML = `♪ ${mData[id]}`;
          b.onclick = () => playMusic(id); document.getElementById('mGrid').appendChild(b);
        });

        Object.keys(eData).forEach(id => {
          const b = document.createElement('button'); 
          b.className = 'video-btn'; 
          b.id = 'btn-eff-' + id;
          b.innerHTML = eData[id];
          b.onclick = () => toggleEffect(id); 
          document.getElementById('eGrid').appendChild(b);
        });

        document.getElementById('uiDrag').onmousedown = e => { state.ui.drag = true; state.ui.off.x = e.clientX - state.ui.cx; state.ui.off.y = e.clientY - state.ui.cy; };
        document.getElementById('musicDrag').onmousedown = e => { 
          if(e.target.closest('#volGauge') || e.target.closest('.vol-wrap')) return;
          state.music.drag = true; state.music.off.x = e.clientX - state.music.cx; state.music.off.y = e.clientY - state.music.cy; 
        };
        
        document.getElementById('hueBar').onmousedown = e => { state.isChangingHue = true; handleHue(e); };
        function handleHue(e) { const rect = document.getElementById('hueBar').getBoundingClientRect(); state.hue = Math.max(0, Math.min((e.clientX - rect.left) / rect.width, 1)) * 360; updateStyles(); }
        document.getElementById('alphaBar').onmousedown = e => { state.isChangingAlpha = true; handleAlpha(e); };
        function handleAlpha(e) { const rect = document.getElementById('alphaBar').getBoundingClientRect(); state.alpha = Math.max(0, Math.min((e.clientX - rect.left) / rect.width, 1)); updateStyles(); }

        document.getElementById('seekGauge').onmousedown = e => { e.stopPropagation(); state.isSeeking = true; handleSeek(e); };
        document.getElementById('volGauge').onmousedown = e => { e.stopPropagation(); state.isChangingVol = true; handleVol(e); };

        document.addEventListener('mousemove', e => {
          state.mouse.realX = e.clientX; state.mouse.realY = e.clientY;
          if(state.isChangingHue) handleHue(e); 
          if(state.isChangingAlpha) handleAlpha(e);
          if(state.isSeeking) handleSeek(e);
          if(state.isChangingVol) handleVol(e);

          ['ui', 'music'].forEach(k => { if(state[k].drag){ state[k].cx = state[k].tx = e.clientX - state[k].off.x; state[k].cy = state[k].ty = e.clientY - state[k].off.y; enforceBounds(k); }});
          state.mouse.x = (e.clientX - window.innerWidth/2)*0.1; state.mouse.y = (e.clientY - window.innerHeight/2)*0.1;
        });

        document.addEventListener('mouseup', () => {
          state.isChangingHue = false; state.isChangingAlpha = false;
          state.isSeeking = false; state.isChangingVol = false;
          ['ui', 'music'].forEach(k => { if(state[k].drag){ state[k].drag = false; enforceBounds(k); localStorage.setItem(k+'Pos', JSON.stringify({x:state[k].tx, y:state[k].ty})); }});
        });

        const lastM = localStorage.getItem('lastMusicId') || Object.keys(mData)[0];
        const lastV = localStorage.getItem('musicVol') || 0.5;
        if(lastM) bgMusic.src = `musics/${lastM}.mp3`;
        bgMusic.volume = lastV;
        document.getElementById('volFill').style.width = (lastV * 100) + '%';
        document.getElementById('curMusicTitle').textContent = mData[lastM] || "NO TRACK";
        
        // 壁紙の初期読み込み処理：URLかIDか判別
        const lastVid = localStorage.getItem('lastWallpaperId') || Object.keys(vData)[0];
        if(lastVid) {
          if(lastVid.startsWith('http')) {
            bgVideo.src = lastVid;
            document.getElementById('customVideoUrl').value = lastVid;
          } else {
            bgVideo.src = `background/${lastVid}.mp4`;
          }
          bgVideo.play().catch(()=>{});
        }
        
        if(isSticky) document.getElementById('musicPanel').classList.add('active');
        updateStyles(); updatePlayerUI(); update(); setInterval(updateTime, 1000); updateTime();
        initParticles(state);
      }

      // カスタムURLを設定する関数
      window.setCustomWallpaper = () => {
        const url = document.getElementById('customVideoUrl').value.trim();
        if(!url) return;
        bgVideo.style.opacity = 0;
        setTimeout(() => {
          bgVideo.src = url;
          bgVideo.onloadeddata = () => {
            bgVideo.style.opacity = 1;
            bgVideo.play();
          };
          localStorage.setItem('lastWallpaperId', url);
        }, 300);
      };

      window.playMusic = (id) => { bgMusic.src = `musics/${id}.mp3`; bgMusic.play(); localStorage.setItem('lastMusicId', id); document.getElementById('curMusicTitle').textContent = mData[id]; updatePlayerUI(); };
      window.togglePlay = () => { bgMusic.paused ? bgMusic.play() : bgMusic.pause(); updatePlayerUI(); };
      window.toggleLoop = () => { isLoop = !isLoop; bgMusic.loop = isLoop; localStorage.setItem('musicLoop', isLoop); updatePlayerUI(); };
      window.toggleRandom = () => { isRandom = !isRandom; localStorage.setItem('musicRandom', isRandom); updatePlayerUI(); };
      
      window.nextTrack = () => { 
        const k = Object.keys(mData); 
        if(isRandom && k.length > 1) {
          let next;
          const current = localStorage.getItem('lastMusicId');
          do { next = k[Math.floor(Math.random() * k.length)]; } while(next === current);
          playMusic(next);
        } else {
          let i = k.indexOf(localStorage.getItem('lastMusicId')) + 1; 
          playMusic(k[i >= k.length ? 0 : i]); 
        }
      };
      
      window.prevTrack = () => { const k = Object.keys(mData); let i = k.indexOf(localStorage.getItem('lastMusicId')) - 1; playMusic(k[i < 0 ? k.length - 1 : i]); };
      bgMusic.onended = () => { if(!isLoop) nextTrack(); };
      bgMusic.ontimeupdate = () => { if(!bgMusic.duration) return; document.getElementById('seekFill').style.width = (bgMusic.currentTime/bgMusic.duration*100)+'%'; document.getElementById('currentTime').textContent = fmtFull(bgMusic.currentTime); };

      function updatePlayerUI() { document.getElementById('btn-play').src = bgMusic.paused ? "buttons/start.png" : "buttons/stop.png"; document.getElementById('btn-loop').classList.toggle('active', isLoop); document.getElementById('btn-random').classList.toggle('active', isRandom); document.getElementById('stickyStat').textContent = isSticky ? 'ON' : 'OFF'; }
      function updatePerChar(el, val) { const cur = Array.from(el.children); const old = cur.map(s => s.dataset.char || '').join(''); if (old === val) return; el.innerHTML = val.split('').map(c => `<span class=\"char-slot\" data-char=\"${c}\"><span class=\"char-group\"><span class=\"main-char\">${c}</span></span></span>`).join(''); }
      function updateTime() { const n = new Date(), f = v => String(v).padStart(2, '0'); updatePerChar(document.getElementById('clock'), `${f(n.getHours())}:${f(n.getMinutes())}:${f(n.getSeconds())}`); updatePerChar(document.getElementById('weekday'), ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][n.getDay()]); }
      window.scrollList = (id, amt) => { const s = state.scroll[id]; s.tgt = Math.max(0, Math.min(s.tgt + amt, s.el.scrollHeight - s.el.clientHeight)); };
      window.toggleUI = () => { const a = document.getElementById('uiPanel').classList.toggle('active'); if(a) document.getElementById('musicPanel').classList.add('active'); else if(!isSticky) document.getElementById('musicPanel').classList.remove('active'); };
      window.toggleSticky = () => { isSticky = !isSticky; localStorage.setItem('musicSticky', isSticky); updatePlayerUI(); };
      window.resetUI = () => { localStorage.clear(); location.reload(); };
      function fmtFull(s){ const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),r=Math.floor(s%60); return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'); }

      function initParticles(mainState) {
        const canvas = document.getElementById('effectCanvas');
        const ctx = canvas.getContext('2d');
        let pArr = [], trail = [], trailLength = 25;
        let lastX = 0, lastY = 0;
        function res() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', res); res();
        class P {
          constructor() { this.init(); }
          init() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.s = Math.random() * 2 + 1; this.vx = (Math.random()-0.5)*0.4; this.vy = (Math.random()-0.5)*0.4; this.o = Math.random()*0.6+0.2; }
          up() { this.x += this.vx + (mainState.mouse.cx*0.08); this.y += this.vy + (mainState.mouse.cy*0.08); if (this.x<0||this.x>canvas.width||this.y<0||this.y>canvas.height) this.init(); }
          dr() {
            if (!mainState.effects.dots) return; 
            if (mainState.effects.conn) {
              const dx = mainState.mouse.realX - this.x, dy = mainState.mouse.realY - this.y, dist = Math.sqrt(dx*dx+dy*dy);
              if (dist < 180) {
                const ratio = (1-dist/180);
                ctx.strokeStyle = `hsla(${mainState.hue}, 100%, 50%, ${ratio * mainState.alpha * 0.3})`;
                ctx.lineWidth = ratio * 1.2;
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(mainState.mouse.realX, mainState.mouse.realY); ctx.stroke();
              }
            }
            ctx.fillStyle = `hsla(${mainState.hue}, 100%, 50%, ${mainState.alpha * this.o})`;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.s, 0, Math.PI*2); ctx.fill();
          }
        }
        for(let i=0; i<70; i++) pArr.push(new P());
        function loop() {
          ctx.clearRect(0,0,canvas.width,canvas.height);
          ctx.globalCompositeOperation = 'lighter';
          if (mainState.effects.trail) {
            const dx = mainState.mouse.realX - lastX; const dy = mainState.mouse.realY - lastY; const dist = Math.sqrt(dx*dx+dy*dy);
            if (dist > 1) { trail.push({ x: mainState.mouse.realX, y: mainState.mouse.realY }); lastX = mainState.mouse.realX; lastY = mainState.mouse.realY; }
            if (trail.length > trailLength || (dist <= 1 && trail.length > 0)) { trail.shift(); }
            if (trail.length > 1) { ctx.lineCap = 'round'; ctx.lineJoin = 'round'; for (let i = 0; i < trail.length - 1; i++) { const ratio = i / trail.length; ctx.strokeStyle = `hsla(${mainState.hue}, 100%, 60%, ${ratio * mainState.alpha * 0.5})`; ctx.lineWidth = ratio * 6; ctx.beginPath(); ctx.moveTo(trail[i].x, trail[i].y); ctx.lineTo(trail[i+1].x, trail[i+1].y); ctx.stroke(); } }
          } else { trail = []; }
          pArr.forEach(p=>{ p.up(); p.dr(); });
          requestAnimationFrame(loop);
        }
        loop();
      }
      init();
    });
  </script>
